[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyincc"
version = "0.0.1"
description = "Software evidence scanner for inventory and evidence collection."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "chiendollar0" }]
dependencies = [
  "PySide6>=6.7",
  "openpyxl>=3.1",
  "pefile>=2023.2.7",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
pyincc = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
